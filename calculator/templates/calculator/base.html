<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Strategy Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px;
           margin: 40px auto; padding: 0 20px; color: #333; }
    nav a { margin-right: 16px; color: #2E75B6; text-decoration: none; }
    .messages li { padding: 8px 12px; border-radius: 4px; list-style: none; }
    .messages .error { background: #fdecea; color: #b00; }
    .messages .success { background: #e8f8e8; color: #060; }
    .result-box { background: #D5E8F0; padding: 16px; border-radius: 6px;
                  margin: 16px 0; font-size: 1.2em; }
    input, select { width: 100%; padding: 8px; margin: 4px 0 12px;
                    box-sizing: border-box; }
    button { background: #1E3A5F; color: white; padding: 10px 24px;
             border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #2E75B6; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'calculator:index' %}">Calculator</a>
    <a href="{% url 'calculator:history' %}">History</a>
  </nav>
  <hr>
  {% if messages %}
  <ul class='messages'>
    {% for message in messages %}
    <li class='{{ message.tags }}'>{{ message }}</li>
    {% endfor %}
  </ul>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
